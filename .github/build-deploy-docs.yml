name: Build and deploy documentation as a static site

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build container image
        run: podman build -f deploy/Containerfile -t ghcr.io/zenmo/luxdocs:latest .

      - name: Push container image
        if: github.event_name == 'push'
        run: podman push ghcr.io/zenmo/luxdocs:latest

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      -   uses: actions/checkout@v5
      -   name: Install SSH key
          uses: shimataro/ssh-key-action@v2
          with:
            key: ${{ secrets.PRODPODS_SSH_PRIVATE_KEY }}
            known_hosts: prodpods.zenmo.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB9QSQTFJtC1QzZ/iBdR6QfIQ8IFFw9ow14PN68fulC7
      -   name: Deploy
          run: ./deploy/deploy.sh
